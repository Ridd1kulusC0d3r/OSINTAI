name: Publish catalog site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated files are in sync
        run: |
          python scripts/validate_catalog.py
          python scripts/render.py --check

      - name: Assemble site
        run: |
          mkdir -p _site/catalog _site/assets
          cp site/index.html site/groups.json _site/
          cp catalog/*.json _site/catalog/
          cp assets/social-preview.png _site/assets/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
