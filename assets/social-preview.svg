<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t">
  <title id="t">OSINTAI — a verification-first map of AI-augmented OSINT</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#121A35"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowv" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>

  <!-- evidence graph -->
  <circle cx="960" cy="300" r="230" fill="url(#glow)"/>
  <circle cx="1150" cy="150" r="120" fill="url(#glowv)"/>
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="960" y1="300" x2="800" y2="180"/>
    <line x1="960" y1="300" x2="780" y2="380"/>
    <line x1="960" y1="300" x2="880" y2="500"/>
    <line x1="960" y1="300" x2="1070" y2="470"/>
    <line x1="800" y1="180" x2="780" y2="380"/>
    <line x1="780" y1="380" x2="880" y2="500"/>
    <line x1="880" y1="500" x2="1070" y2="470"/>
  </g>
  <g stroke="#A78BFA" stroke-width="2.6" stroke-dasharray="8 9" stroke-linecap="round">
    <line x1="1150" y1="150" x2="960" y2="300"/>
    <line x1="1150" y1="150" x2="800" y2="180"/>
    <line x1="1150" y1="150" x2="1140" y2="340"/>
    <line x1="1140" y1="340" x2="1070" y2="470"/>
  </g>
  <g fill="#0B1222" stroke="#5EEAD4" stroke-width="3.5">
    <circle cx="800" cy="180" r="18"/>
    <circle cx="780" cy="380" r="18"/>
    <circle cx="880" cy="500" r="18"/>
    <circle cx="1070" cy="470" r="18"/>
  </g>
  <circle cx="1140" cy="340" r="18" fill="#0B1222" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="5 5"/>
  <text x="1140" y="347" text-anchor="middle" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">?</text>
  <circle cx="960" cy="300" r="44" fill="#0B1222" stroke="#38BDF8" stroke-width="4"/>
  <path d="M940 301l13 13 26-29" fill="none" stroke="#5EEAD4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1150 150)">
    <rect x="-48" y="-30" width="96" height="60" rx="16" fill="#1B1236" stroke="#A78BFA" stroke-width="3"/>
    <text y="9" text-anchor="middle" fill="#E9D5FF" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="23" font-weight="700">LLM</text>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="190" fill="#94A3B8" font-size="22" letter-spacing="3" font-weight="600">OPEN SOURCE INTELLIGENCE × AI</text>
    <text x="74" y="318" font-size="148" font-weight="800" letter-spacing="-3">
      <tspan fill="url(#word)">OSINT</tspan><tspan fill="url(#ai)">AI</tspan>
    </text>
    <text x="80" y="384" fill="#E2E8F0" font-size="34" font-weight="500">A verification-first map of</text>
    <text x="80" y="428" fill="#E2E8F0" font-size="34" font-weight="500">AI-augmented OSINT</text>
  </g>

  <!-- legend + url -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#94A3B8">
    <line x1="80" y1="512" x2="120" y2="512" stroke="#38BDF8" stroke-width="3"/>
    <text x="132" y="518">evidence</text>
    <line x1="252" y1="512" x2="292" y2="512" stroke="#A78BFA" stroke-width="2.6" stroke-dasharray="8 9"/>
    <text x="304" y="518">model suggestion</text>
    <text x="80" y="576" fill="#64748B">github.com/Ridd1kulusC0d3r/OSINTAI</text>
  </g>
</svg>
